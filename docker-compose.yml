version: "3.9"

x-airflow-common: &airflow-common
  image: apache/airflow:2.9.0
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
    AIRFLOW__WEBSERVER__RBAC: "true"
    AIRFLOW__CORE__ENABLE_XCOM_PICKLING: "true"
    _PIP_ADDITIONAL_REQUIREMENTS: "boto3 minio pandas faker psycopg2-binary"
  volumes:
    - ./airflow:/opt/airflow
    - ./spark_jobs:/opt/spark_jobs
    - ./data_gen:/opt/data_gen
  user: "50000:50000"
  depends_on:
    - airflow-postgres
  networks:
    - etl-net

services:
  airflow-postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5434:5432"
    networks:
      - etl-net

  airflow-init:
    <<: *airflow-common
    command: >
      bash -c "
      pip install -r /opt/airflow/requirements.txt &&
      airflow db init &&
      airflow users create
        --username admin
        --password admin
        --firstname Admin
        --lastname User
        --role Admin
        --email admin@example.com || true &&
      airflow connections add minio_conn --conn-type S3 --conn-login minioadmin --conn-password minioadmin --conn-host minio --conn-port 9000 --conn-extra '{"endpoint_url":"http://minio:9000"}' || true &&
      airflow connections add warehouse_postgres --conn-type postgres --conn-host warehouse-postgres --conn-login warehouse --conn-password warehouse --conn-schema warehouse --conn-port 5432 || true
      "
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8082:8080"
    depends_on:
      - airflow-init

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      - airflow-init

  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - etl-net

  minio-create-buckets:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/bronze &&
      mc mb --ignore-existing local/silver &&
      mc mb --ignore-existing local/gold
      "
    networks:
      - etl-net

  # Spark services removed to avoid external image pulls; Spark will run
  # inside the Airflow container via PySpark for local testing.

  warehouse-postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: warehouse
      POSTGRES_PASSWORD: warehouse
      POSTGRES_DB: warehouse
    ports:
      - "5433:5432"
    volumes:
      - warehouse-data:/var/lib/postgresql/data
    networks:
      - etl-net

  streamlit:
    image: python:3.11-slim
    depends_on:
      - warehouse-postgres
    working_dir: /app
    volumes:
      - ./streamlit_app:/app
    command: >
      bash -c "
      pip install streamlit psycopg2-binary pandas &&
      streamlit run app.py --server.port 8501 --server.address 0.0.0.0
      "
    ports:
      - "8501:8501"
    networks:
      - etl-net

networks:
  etl-net:

volumes:
  minio-data:
  warehouse-data:
