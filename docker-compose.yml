version: '3.8'

services:
  postgres:
    image: postgres:14
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - etl_network

  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - etl_network

  airflow-webserver:
    image: apache/airflow:2.7.0
    environment:
      AIRFLOW_HOME: /airflow
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
    volumes:
      - ./dags:/airflow/dags
      - ./scripts:/airflow/scripts
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    command: webserver
    networks:
      - etl_network

  airflow-scheduler:
    image: apache/airflow:2.7.0
    environment:
      AIRFLOW_HOME: /airflow
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
    volumes:
      - ./dags:/airflow/dags
      - ./scripts:/airflow/scripts
    depends_on:
      - postgres
    command: scheduler
    networks:
      - etl_network

  spark-master:
    image: bitnami/spark:3.3.0
    environment:
      SPARK_MODE: master
    ports:
      - "8888:8080"
      - "7077:7077"
    networks:
      - etl_network

  spark-worker:
    image: bitnami/spark:3.3.0
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
    depends_on:
      - spark-master
    networks:
      - etl_network

  streamlit:
    image: python:3.9-slim
    working_dir: /app
    volumes:
      - ./streamlit_app.py:/app/streamlit_app.py
      - ./requirements.txt:/app/requirements.txt
    depends_on:
      - postgres
    environment:
      DB_HOST: postgres
      DB_USER: airflow
      DB_PASSWORD: airflow
      DB_NAME: airflow
    ports:
      - "8501:8501"
    command: bash -c "pip install -r requirements.txt && streamlit run streamlit_app.py"
    networks:
      - etl_network

volumes:
  postgres_data:
  minio_data:

networks:
  etl_network:
    driver: bridge
